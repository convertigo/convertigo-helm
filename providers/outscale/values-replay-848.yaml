# Local 8.4.8 rehearsal overlay. Layer after providers/outscale/values.yaml.
# Fresh, dedicated workspace/namespace only after approval; not an instruction to upgrade an instance.
# Public baseline. A private application build is selected only through an uncommitted URL override.

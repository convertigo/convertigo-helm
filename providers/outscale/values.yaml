# Example only: select classes and an existing Gateway that exist on your OKS cluster.
# No cluster context or credentials belong in this file.
replicaCount: 3
publicAddr: demo.example.com
ssl_only: "true"
progressDeadlineSeconds: 1800

credentials:
  existingSecret: platform-installation
  adoptExisting: false

admin:
  existingSecret: platform-admin
  passwordKey: password

# Envoy Gateway / HTTPRoute is supplied separately; do not install an Ingress controller here.
ingress:
  enabled: false
  rootRedirectEnabled: false

awsMarketplace:
  enabled: false

serviceAccount:
  create: true

workspace:
  accessModes: [ReadWriteMany]
  persistentVolume:
    storageClass: longhorn
    size: 4Gi

sharedWorkspaceSync:
  enabled: true

redis:
  enabled: true
  auth:
    enabled: true
    existingSecret: platform-redis
    existingSecretPasswordKey: redis-password
  sentinel:
    enabled: true
    replicas: 3
  persistence:
    enabled: true
    storageClass: longhorn
    size: 1Gi

baserow:
  existingSecret: platform-database
  existingSecretPasswordKey: baserow-password
  plugins:
    c8oforms:
      enabled: true
  persistentVolume:
    storageClass: longhorn

timescaledb:
  existingSecret: platform-database
  existingSecretPasswordKey: postgres-password
  existingSecretBillingPasswordKey: billing-password
  persistentVolume:
    storageClass: longhorn

couchdb:
  existingSecret: platform-couchdb
  existingSecretUsernameKey: username
  existingSecretPasswordKey: password
  persistentVolume:
    storageClass: longhorn

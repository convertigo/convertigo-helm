{{- if .Values.baserow.enabled }}
{{- $c8oforms := include "convertigo.baserowC8oforms" . | fromJson }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "convertigo.fullname" . }}-br
  labels:
    {{- include "convertigo.labels" . | nindent 4 }}-br
spec:
  replicas: 1
  # The all-in-one image shares its Redis data and migrates the database at startup.
  # Stop the old version before starting a pod with the same persistent volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "convertigo.selectorLabels" . | nindent 6 }}-br
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/credential-bootstrap: {{ include (print $.Template.BasePath "/credential-bootstrap-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "convertigo.selectorLabels" . | nindent 8 }}-br
    spec:
      serviceAccountName: {{ include "convertigo.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes: 
        - name : br-data
          persistentVolumeClaim:
            claimName: {{ include "convertigo.fullname" . }}-br-workspace
        {{- if $c8oforms.enabled }}
        # C8oForms plugin: the archive is installed by the image at each start, from BASEROW_PLUGIN_URLS.
        - name: c8oforms-plugin
          configMap:
            name: {{ $c8oforms.configMap }}
        # The all-in-one image keeps its installed plugins in /baserow/data/plugins, on the Baserow volume, and
        # reinstalls them at each start. An emptyDir there leaves the archive above as the only source, as with
        # the baserow/backend image: disabling the plugin or changing its version takes effect at the next start.
        - name: br-plugins
          emptyDir: {}
        {{- end }}
        - name: credential-bootstrap
          configMap:
            name: {{ include "convertigo.fullname" . }}-credential-bootstrap
        - name: baserow-admin
          secret:
            secretName: {{ include "convertigo.baserowAdminSecretName" . }}
            defaultMode: 0444
            items:
              - key: {{ default "baserow-admin-password" (.Values.baserow.admin | default dict).passwordKey }}
                path: password
      initContainers:
        - name: baserow-setup
          image: {{ .Values.baserow.image.repository }}:{{ .Values.baserow.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "/bootstrap/baserow-init.sh"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "convertigo.baserowDatabaseEnv" . | nindent 12 }}
            - name: BOOTSTRAP_BASEROW_EMAIL
              value: {{ default "admin@convertigo.com" (.Values.baserow.admin | default dict).email | quote }}
            - name: BOOTSTRAP_BASEROW_NAME
              value: {{ default "Platform administrator" (.Values.baserow.admin | default dict).name | quote }}
            - name: BOOTSTRAP_ADOPT_EXISTING
              value: {{ ternary "true" "false" (dig "adoptExisting" false (.Values.credentials | default dict)) | quote }}
            - name: BOOTSTRAP_PUBLIC_SIGNUP
              value: {{ ternary "true" "false" (dig "allowPublicSignup" false (.Values.baserow.admin | default dict)) | quote }}
          volumeMounts:
            - name: br-data
              mountPath: /baserow/data
            - name: credential-bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: baserow-admin
              mountPath: /run/baserow-admin
              readOnly: true
          resources:
            {{- toYaml .Values.baserow.resources | nindent 12 }}
      containers:
        - name: {{ .Chart.Name }}-br
          command: ["/bin/sh", "-c", "sed -i -e s,127.0.0.1,0.0.0.0, /baserow/supervisor/default_baserow_env.sh && /baserow.sh start"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ .Values.baserow.image.repository }}:{{ .Values.baserow.image.tag }}
          volumeMounts:
            - name: br-data
              mountPath: /baserow/data
            {{- if $c8oforms.enabled }}
            - name: br-plugins
              mountPath: /baserow/data/plugins
            - name: c8oforms-plugin
              mountPath: /c8o-plugins
              readOnly: true
            {{- end }}
          env:
            {{- include "convertigo.baserowDatabaseEnv" . | nindent 12 }}
            - name: BASEROW_EXTRA_ALLOWED_HOSTS
              value: "*"
            {{- if $c8oforms.enabled }}
            # Next to the mount: a container with the variable and without the file does not start.
            - name: BASEROW_PLUGIN_URLS
              value: {{ printf "file:///c8o-plugins/%s" $c8oforms.archive | quote }}
            # The image installs the plugin with pip, by default in an isolated build environment that downloads
            # setuptools from PyPI: without Internet access, Baserow would not start. "false" (sic, pip inverts
            # this variable) builds it with the setuptools of the image instead, offline.
            - name: PIP_NO_BUILD_ISOLATION
              value: "false"
            {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            {{- toYaml .Values.baserow.resources | nindent 12 }}
{{- end }}                

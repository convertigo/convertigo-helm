{{- if .Values.couchdb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "convertigo.fullname" . }}-cdb
  labels:
    {{- include "convertigo.labels" . | nindent 4 }}-cdb
spec:
  strategy:
    {{- include "convertigo.singlePodStrategy" . | nindent 4 }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "convertigo.selectorLabels" . | nindent 6 }}-cdb
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "convertigo.selectorLabels" . | nindent 8 }}-cdb
    spec:
      affinity:
        {{- include "convertigo.singlePodAffinity" (dict "labels" (printf "%s-cdb" (include "convertigo.selectorLabels" .))) | nindent 8 }}
      serviceAccountName: {{ include "convertigo.serviceAccountName" . }}
      volumes: 
        - name : cdb-data
          persistentVolumeClaim:
            claimName: {{ include "convertigo.fullname" . }}-cdb-workspace
      containers:
        - name: {{ .Chart.Name }}-cdb
          command: ["/bin/sh", "-c", "echo '[couchdb]\nsingle_node=true' > /opt/couchdb/etc/local.d/setup.ini && /docker-entrypoint.sh couchdb"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ .Values.couchdb.image.repository }}:{{ .Values.couchdb.image.tag }}
          volumeMounts:
            - name: cdb-data
              mountPath: /opt/couchdb/data
          env:
            {{- include "convertigo.componentEnvironment" (list . "-cdb" (include "convertigo.defaultEnvironment_cdb" .) (list "COUCHDB_USER" "COUCHDB_PASSWORD")) | nindent 12 }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5984
              protocol: TCP
          resources:
            {{- toYaml .Values.couchdb.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /_utils
              port: http
          readinessProbe:
            httpGet:
              path: /_utils
              port: http

{{- end }}
       

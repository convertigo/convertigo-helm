{{- if .Values.timescaledb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "convertigo.fullname" . }}-timescale
  labels:
    {{- include "convertigo.labels" . | nindent 4 }}-timescaledb
spec:
  strategy:
    {{- include "convertigo.singlePodStrategy" . | nindent 4 }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "convertigo.selectorLabels" . | nindent 6 }}-timescaledb
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "convertigo.selectorLabels" . | nindent 8 }}-timescaledb
    spec:
      affinity:
        {{- include "convertigo.singlePodAffinity" (dict "labels" (printf "%s-timescaledb" (include "convertigo.selectorLabels" .))) | nindent 8 }}
      serviceAccountName: {{ include "convertigo.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes: 
        - name: timescaledb-data
          persistentVolumeClaim:
            claimName: {{ include "convertigo.fullname" . }}-timescaledb-workspace
        - name: init-scripts
          configMap:
            name: c8o-init-scripts
            defaultMode: 0777
      containers:
        - name: {{ .Chart.Name }}-timescaledb
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "convertigo.timescaleImage" . | quote }}
          volumeMounts:
            - name: timescaledb-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          env:
            {{- include "convertigo.componentEnvironment" (list . "-timescale" (include "convertigo.defaultEnvironment_timescale" .) (list "PGDATA" "POSTGRES_PASSWORD" "POSTGRES_USER" "BILLING_DB" "BILLING_PASSWORD" "BILLING_USER" "BASEROW_DB" "BASEROW_USER" "BASEROW_PASSWORD")) | nindent 12 }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5432
          resources:
            {{- toYaml .Values.timescaledb.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 5432
          readinessProbe:
            tcpSocket:
              port: 5432
{{- end }}                
{{- $admin := default dict .Values.admin -}}
{{- $name := include "convertigo.adminSecretName" . -}}
{{- $previous := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and (not $admin.existingSecret) (or $previous (not (include "convertigo.existingInstallation" .))) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "convertigo.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $previous }}
  {{- toYaml $previous.data | nindent 2 }}
  {{- else }}
  {{ default "password" $admin.passwordKey }}: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
{{- end }}

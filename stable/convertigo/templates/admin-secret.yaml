{{- $admin := default dict .Values.admin -}}
{{- $name := include "convertigo.adminSecretName" . -}}
{{- if not $admin.existingSecret -}}
{{- $key := default "password" $admin.passwordKey -}}
{{- $previous := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := randAlphaNum 48 | b64enc -}}
{{- if $previous -}}
{{- $password = required "The generated admin Secret is missing its password key" (index $previous.data $key) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "convertigo.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ $password | quote }}
{{- end }}

{{- if and (not (empty .Values.nocodestudio.version)) (not (regexMatch "^[a-zA-Z0-9][a-zA-Z0-9._+-]*$" (toString .Values.nocodestudio.version))) -}}
{{- fail "nocodestudio.version must be a public release tag" -}}
{{- end -}}
{{- if and (not (include "convertigo.existingInstallation" .)) .Values.nocodestudio.enable (dig "enabled" true (.Values.projectInstallation | default dict)) (empty .Values.nocodestudio.version) -}}
{{- fail "Select and verify a published nocodestudio.version before starting a new No Code installation" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "convertigo.fullname" . }}-workspace-setup
data:
  installCarFiles.sh: |
    #!/bin/bash
    set -euo pipefail
    umask 077
    WORKSPACE="${WORKSPACE:-/workspace}"
    PROJECTS_DIR="$WORKSPACE/projects"
    CONFIG_DIR="$WORKSPACE/configuration"
    PRESERVE_CREDENTIALS="{{ if include "convertigo.existingInstallation" . }}true{{ else }}false{{ end }}"
    OWNER_UID={{ include "convertigo.runAsUserId" . }}
    OWNER_GID={{ include "convertigo.runAsGroupId" . }}
    BASEROW_ENABLED="{{ if .Values.baserow.enabled }}true{{ else }}false{{ end }}"
    NOCODESTUDIO_ENABLED="{{ if .Values.nocodestudio.enable }}true{{ else }}false{{ end }}"
    NOCODESTUDIO_VERSION={{ default "" .Values.nocodestudio.version | quote }}
    INSTALL_ENABLED="{{ dig "enabled" true (.Values.projectInstallation | default dict) }}"
    METERING_ENABLED="{{ dig "enabled" false (.Values.awsMarketplace | default dict) }}"
    command -v flock >/dev/null || { echo "Workspace setup requires flock" >&2; exit 1; }
    if [[ $(id -u) == 0 ]]; then
      chown "$OWNER_UID:$OWNER_GID" "$WORKSPACE"
    fi
    touch "$WORKSPACE/.chart-install.lock"
    if [[ $(id -u) == 0 ]]; then
      chown "$OWNER_UID:$OWNER_GID" "$WORKSPACE/.chart-install.lock"
      chmod 660 "$WORKSPACE/.chart-install.lock"
    fi
    exec 9<>"$WORKSPACE/.chart-install.lock"
    flock -x -w {{ default 900 (.Values.projectInstallation | default dict).lockTimeoutSeconds }} 9
    # A retained/legacy workspace is not a new credential identity, including after reinstall.
    if [[ -f "$WORKSPACE/.chart-install-complete" ]] || { [[ ! -f "$CONFIG_DIR/.chart-crypto-state" ]] && { [[ -n "$(ls -A "$CONFIG_DIR" 2>/dev/null)" ]] || [[ -n "$(ls -A "$PROJECTS_DIR" 2>/dev/null)" ]]; }; }; then
      PRESERVE_CREDENTIALS=true
    fi
    # A new No Code workspace needs an explicitly selected published release. Existing projects
    # remain untouched when no new version is selected; never request an empty or guessed tag.
    if [[ "$INSTALL_ENABLED" == true && "$NOCODESTUDIO_ENABLED" == true ]]; then
      if [[ -z "$NOCODESTUDIO_VERSION" && "$PRESERVE_CREDENTIALS" != true ]]; then
        echo "Select a published nocodestudio.version before initializing a new No Code workspace" >&2
        exit 1
      fi
      if [[ -n "$NOCODESTUDIO_VERSION" && ! "$NOCODESTUDIO_VERSION" =~ ^[a-zA-Z0-9][a-zA-Z0-9._+-]*$ ]]; then
        echo "nocodestudio.version must be a release tag" >&2
        exit 1
      fi
    fi
    mkdir -p "$PROJECTS_DIR" "$CONFIG_DIR"
    STAGE=$(mktemp -d "$WORKSPACE/.chart-install.XXXXXX")
    trap 'rm -rf -- "$STAGE"' EXIT
    MARKER="$WORKSPACE/.chart-install-complete"
    SIGNATURE="v2:nocode=$NOCODESTUDIO_ENABLED:$NOCODESTUDIO_VERSION:install=$INSTALL_ENABLED:metering=$METERING_ENABLED"
    # Existing projects remain intact. Only complete, staged project directories are published.
    publish_projects() {
      local project
      for project in "$STAGE/projects/"*; do
        [[ -d "$project" ]] || continue
        if [[ ! -e "$PROJECTS_DIR/$(basename "$project")" ]]; then
          mv -- "$project" "$PROJECTS_DIR/"
        fi
      done
    }
    ADMIN_SECRET_FILE="${ADMIN_SECRET_FILE:-/run/convertigo-admin/password}"
    export BOOTSTRAP_CUSTOM_PASSPHRASE="{{ if include "convertigo.customPassphrase" . }}true{{ else }}false{{ end }}"
    export BOOTSTRAP_CRYPTO_COMPATIBLE="{{ if (.Values.crypto | default dict).engineCompatibilityConfirmed }}true{{ else }}false{{ end }}"
    export WORKSPACE
    export BOOTSTRAP_COUCH_USER={{ .Values.couchdb.admin | quote }}
    export BOOTSTRAP_BASEROW_EMAIL={{ default "admin@convertigo.com" (.Values.baserow.admin | default dict).email | quote }}
    export BOOTSTRAP_REDIS_PASSWORD="{{ if and .Values.redis.enabled .Values.redis.auth.enabled (not .Values.redis.auth.passwordFile) }}true{{ else }}false{{ end }}"
    CLASSPATH=""
    for jar in "${CATALINA_HOME:-/usr/local/tomcat}"/webapps/convertigo/WEB-INF/lib/*.jar; do
      CLASSPATH="${CLASSPATH:+$CLASSPATH:}$jar"
    done
    initialize_credentials() {
      java -Xmx256m --class-path "$CLASSPATH" "${CREDENTIAL_BOOTSTRAP_SOURCE:-/bootstrap/InitializeWorkspace.java}" "$1" > "$STAGE/credential-init.log" 2>&1 || {
        echo "Workspace credential initialization requires private review" >&2
        exit 1
      }
    }
    if [[ "$PRESERVE_CREDENTIALS" != true ]]; then initialize_credentials prepare; fi
    # Create global_symbols.properties only if it does not exist
    GLOBAL_SYMBOLS="$CONFIG_DIR/global_symbols.properties"
    if [[ "$PRESERVE_CREDENTIALS" != true && ! -f "$GLOBAL_SYMBOLS" ]]; then
        echo "No Symbols found, generating Symbols"
        mkdir -p "$CONFIG_DIR"
        cat > "$STAGE/global_symbols.properties" << EOF
    C8Oforms.baserow.iframe={{ include "convertigo.publicUrl" . }}/convertigo/projects/BaserowIntegration/c8o/
    lib_baserow.https=false
    lib_baserow.port=8000
    lib_baserow.server={{ include "convertigo.fullname" . }}-br

    C8Oforms.EnableProductTour=false
    C8Oforms.hideConvertigoLogin=false
    C8Oforms.hidePasswordForgotten=false
    C8Oforms.max_tiny_img_size=1500
    C8Oforms.max_tiny_img_size_msg=*** MAX TINY MCE IMG SIZE MESSAGE ***
    C8Oforms.max_tiny_warn_msg=
    C8Oforms.maxThreads=20

    C8OBilling.database={{ include "convertigo.fullname" . }}-timescaledb
    C8OBilling.user={{ .Values.timescaledb.billing_user }}

    lib.actions.c8oforms.smtp.port=587
    lib.actions.c8oforms.smtp.security=Basic
    lib.actions.c8oforms.smtp.sender=Convertigo Forms Builder <noreply@convertigo.com>
    lib.actions.c8oforms.smtp.server=smtp-relay.brevo.com
    lib.actions.c8oforms.smtp.user=
    lib.actions.c8oforms.sql.host=
    lib.actions.c8oforms.sql.port=
    lib.actions.c8oforms.sql.pwd=
    lib.actions.c8oforms.sql.user=
    lib_UserManager.smtp.port=465
    lib_UserManager.smtp.sender=Convertigo <noreply@convertigo.com>
    lib_UserManager.smtp.server=smtp.gmail.com
    lib_UserManager.smtp.user=noreply@convertigo.com
    lib_UserManager_ui_ngx.metadata={"appName": "Convertigo No code studio", "imgUrl": "https://cdn.prod.website-files.com/62d55bc018a5be3f0b91fcf3/62d55bc018a5be089691fd24_Color%3DBlueConvertigo.png", "htmlText": ""}
    lib_oauth.azuread.clientid=
    lib_oauth.azuread.tenantid=common
    lib_oauth.github.clientid=
    lib_oauth.google.clientid=
    lib_oauth.linkedin.clientid=
    lib_oauth.openid.clientid=
    lib_oauth.openid.instrospect_url=
    lib_producttour.weglot_api_key=
    EOF
        mv -- "$STAGE/global_symbols.properties" "$GLOBAL_SYMBOLS"
    fi


    if [[ "$INSTALL_ENABLED" == true && "$(cat "$MARKER" 2>/dev/null || true)" != "$SIGNATURE" ]]; then
      mkdir -p "$STAGE/projects"
      if [[ "$NOCODESTUDIO_ENABLED" == true && -n "$NOCODESTUDIO_VERSION" ]]; then
        curl --fail --location --retry 3 "https://github.com/convertigo/C8oForms/releases/download/$NOCODESTUDIO_VERSION/c8oforms_standalone.tar.gz" -o "$STAGE/forms.tar.gz"
        tar xzf "$STAGE/forms.tar.gz" --no-same-owner --strip-components=4 -C "$STAGE/projects" --wildcards 'c8oforms_standalone/data/workspace/projects/*'
        publish_projects
      fi
      if [[ "$METERING_ENABLED" == true && ! -d "$PROJECTS_DIR/AwsMetering" ]]; then
        curl --fail --location --retry 3 https://github.com/convertigo/c8oprj-aws-metering/archive/refs/heads/master.zip -o "$STAGE/metering.zip"
        unzip -q "$STAGE/metering.zip" -d "$STAGE/metering"
        mv -- "$STAGE/metering/c8oprj-aws-metering-master" "$PROJECTS_DIR/AwsMetering"
      fi
    fi
    if [[ "$PRESERVE_CREDENTIALS" != true ]]; then
    # The Secret is visible to this init only. Store the hash, never a JVM option or environment value.
    test -s "$ADMIN_SECRET_FILE" || { echo "Admin credential file is empty" >&2; exit 1; }
    ADMIN_HASH=$(sha512sum < "$ADMIN_SECRET_FILE" | cut -d ' ' -f1)
    PROPERTIES="$CONFIG_DIR/engine.properties"
    # A newly generated Secret must not replace a previously customized admin account.
    EXISTING_HASH=$(awk '/^[[:space:]]*admin[.]password[[:space:]]*[=:]/{sub(/^[[:space:]]*admin[.]password[[:space:]]*[=:][[:space:]]*/, ""); print; exit}' "$PROPERTIES" 2>/dev/null || true)
    DEFAULT_HASH=$(printf admin | sha512sum | cut -d ' ' -f1)
    FORCE_ADMIN="{{ if (.Values.admin | default dict).existingSecret }}true{{ else }}false{{ end }}"
    if [[ "$FORCE_ADMIN" == true || -z "$EXISTING_HASH" || "$EXISTING_HASH" == "$DEFAULT_HASH" || "$EXISTING_HASH" == 92668751 ]]; then
      if [[ -f "$PROPERTIES" ]]; then
        awk '!/^[[:space:]]*admin[.](username|password)[[:space:]]*[=:]/ && !/^[[:space:]]*anonymous[.]dashboard[[:space:]]*[=:]/' "$PROPERTIES" > "$STAGE/engine.properties"
      else
        : > "$STAGE/engine.properties"
      fi
      printf '\nadmin.username=%s\nadmin.password=%s\nanonymous.dashboard=false\n' '{{ default "admin" (.Values.admin | default dict).username }}' "$ADMIN_HASH" >> "$STAGE/engine.properties"
      chmod 600 "$STAGE/engine.properties"
      mv -- "$STAGE/engine.properties" "$PROPERTIES"
    fi
    chmod 600 "$PROPERTIES"
    unset EXISTING_HASH DEFAULT_HASH
    unset ADMIN_HASH
    initialize_credentials symbols
    fi
    # Always repair legacy/interrupted root-owned files, even when projects already exist.
    if [[ $(id -u) == 0 ]]; then
      find "$PROJECTS_DIR" "$CONFIG_DIR" -xdev \( ! -uid "$OWNER_UID" -o ! -gid "$OWNER_GID" \) -exec chown -h "$OWNER_UID:$OWNER_GID" {} +
    fi
    printf '%s\n' "$SIGNATURE" > "$STAGE/complete"
    if [[ $(id -u) == 0 ]]; then chown "$OWNER_UID:$OWNER_GID" "$STAGE/complete"; fi
    mv -- "$STAGE/complete" "$MARKER"
    echo "Workspace setup completed"

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "convertigo.fullname" . }}-credential-bootstrap
data:
  InitializeWorkspace.java: |
{{ .Files.Get "files/bootstrap/InitializeWorkspace.java" | indent 4 }}
  baserow-admin.py: |
{{ .Files.Get "files/bootstrap/baserow-admin.py" | indent 4 }}
  baserow-init.sh: |
    #!/bin/bash
    set -euo pipefail
    umask 077
    temporary=$(mktemp -d)
    redis_pid=""
    finish() {
      if [[ -n "$redis_pid" ]]; then kill "$redis_pid" 2>/dev/null || true; wait "$redis_pid" 2>/dev/null || true; fi
      rm -rf -- "$temporary"
    }
    trap finish EXIT
    log="$temporary/initialize.log"
    # The one-off backend commands use a private local cache before the main service starts.
    export REDIS_HOST=127.0.0.1 REDIS_PORT=6379 REDIS_PROTOCOL=redis
    unset REDIS_URL
    REDIS_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
    export REDIS_PASSWORD
    printf 'bind 127.0.0.1\nport 6379\nsave ""\nappendonly no\nmaxmemory 64mb\nmaxmemory-policy noeviction\nrequirepass %s\n' "$REDIS_PASSWORD" > "$temporary/redis.conf"
    redis-server "$temporary/redis.conf" > "$log" 2>&1 &
    redis_pid=$!
    ready=false
    for attempt in {1..60}; do
      if REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli -h 127.0.0.1 -p 6379 ping > /dev/null 2>&1; then ready=true; break; fi
      sleep 1
    done
    [[ "$ready" == true ]] || { echo "Baserow initialization cache is unavailable" >&2; exit 1; }
    # A fresh block volume is mounted root-owned and the image only hands its subdirectories to the Baserow
    # user, who runs the account bootstrap and keeps its lock and marker at the top of the data directory.
    if [[ $(id -u) == 0 ]]; then chown "${DOCKER_USER:-baserow_docker_user}": "${DATA_DIR:-/baserow/data}"; fi
    # No HTTP listener starts in this init container.
    /baserow.sh backend-cmd wait_for_db > "$log" 2>&1 || { echo "Baserow database wait failed" >&2; exit 1; }
    /baserow.sh backend-cmd manage locked_migrate > "$log" 2>&1 || { echo "Baserow database initialization failed" >&2; exit 1; }
    /baserow.sh backend-cmd manage shell < /bootstrap/baserow-admin.py > "$log" 2>&1 || { echo "Baserow account initialization requires private review" >&2; exit 1; }

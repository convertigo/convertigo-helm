{{- $crypto := .Values.crypto | default dict -}}
{{- $name := include "convertigo.cryptoSecretName" . -}}
{{- $previous := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and (not $crypto.existingSecret) (or (and $previous (include "convertigo.existingInstallation" .)) (and $crypto.passphrase (not (include "convertigo.existingInstallation" .)))) -}}
{{- if and (not $previous) (not (kindIs "string" $crypto.passphrase)) -}}
{{- fail "crypto.passphrase must be a string or use crypto.existingSecret" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "convertigo.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $previous }}
  {{- toYaml $previous.data | nindent 2 }}
  {{- else }}
  {{ default "crypto-passphrase" $crypto.passphraseKey }}: {{ $crypto.passphrase | b64enc | quote }}
  {{- end }}
{{- end }}

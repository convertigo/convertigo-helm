{{- $name := include "convertigo.installationSecretName" . -}}
{{- $previous := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and (not (.Values.credentials | default dict).existingSecret) (or $previous (not (include "convertigo.existingInstallation" .))) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "convertigo.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $previous }}
  {{- toYaml $previous.data | nindent 2 }}
  {{- else }}
  {{- $values := dict "postgres-password" .Values.timescaledb.password "billing-password" .Values.timescaledb.billing_password "baserow-database-password" .Values.baserow.baserow_password "couchdb-password" .Values.couchdb.password "redis-password" .Values.redis.auth.password -}}
  {{- range $key := list "baserow-admin-password" "postgres-password" "billing-password" "baserow-database-password" "couchdb-password" "redis-password" }}
  {{ $key }}: {{ (get $values $key | default (randAlphaNum 64)) | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}

{{- $name := include "convertigo.installationSecretName" . -}}
{{- if not (.Values.credentials | default dict).existingSecret -}}
{{- $previous := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "convertigo.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key := list "crypto-passphrase" "baserow-admin-password" "postgres-password" "billing-password" "baserow-database-password" "couchdb-password" "redis-password" }}
  {{- $value := randAlphaNum 64 | b64enc -}}
  {{- if $previous -}}{{- $value = required "An installation credential key is missing; restore the existing Secret" (index $previous.data $key) -}}{{- end }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

{{- $sessionMode := include "convertigo.sessionStoreMode" . -}}
{{- $redisPasswordSource := include "convertigo.redisPasswordSource" . -}}
{{- $redisTls := default dict .Values.redis.tls -}}
{{- $redisTlsMountPath := include "convertigo.redisTlsMountPath" . -}}
{{- $redisTlsSecret := include "convertigo.redisTlsSecretName" . -}}
{{- if and (eq $sessionMode "redis") .Values.redis.enabled (not (include "convertigo.redisSentinel" .)) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "convertigo.fullname" . }}-redis
  labels:
    app.kubernetes.io/name: {{ include "convertigo.fullname" . }}-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "convertigo.chart" . }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: redis
  selector:
    app.kubernetes.io/name: {{ include "convertigo.fullname" . }}-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "convertigo.fullname" . }}-redis
  labels:
    app.kubernetes.io/name: {{ include "convertigo.fullname" . }}-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "convertigo.chart" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "convertigo.fullname" . }}-redis
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "convertigo.fullname" . }}-redis
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        helm.sh/chart: {{ include "convertigo.chart" . }}
      {{- with .Values.redis.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          {{- with .Values.redis.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $redisPasswordSource }}
          env:
            {{- include "convertigo.redisPasswordEnv" . | trim | nindent 12 }}
          {{- end }}
          {{- if eq $redisPasswordSource "file" }}
          {{- /* The password file can be written by a sidecar (Vault agent) after the container starts */}}
          command: ["sh", "-c", "i=0; while [ ! -s \"$REDIS_PASSWORD_FILE\" ] && [ $i -lt 120 ]; do i=$((i+1)); sleep 1; done; exec docker-entrypoint.sh \"$@\" --requirepass \"$(cat \"$REDIS_PASSWORD_FILE\")\"", "redis"]
          {{- end }}
          args:
            {{- if eq $redisPasswordSource "file" }}
            - redis-server
            {{- end }}
            - "--save"
            - "60"
            - "1"
            - "--appendonly"
            - "no"
          {{- if $redisTls.enabled }}
            - "--port"
            - "0"
            - "--tls-port"
            - "{{ .Values.redis.service.port }}"
            - "--tls-cert-file"
            - "{{ $redisTlsMountPath }}/{{ default "redis.crt" $redisTls.certKey }}"
            - "--tls-key-file"
            - "{{ $redisTlsMountPath }}/{{ default "redis.key" $redisTls.keyKey }}"
            - "--tls-ca-cert-file"
            - "{{ $redisTlsMountPath }}/{{ default "ca.crt" $redisTls.caCertKey }}"
            - "--tls-auth-clients"
            - {{ ternary "yes" "no" $redisTls.authClients | quote }}
          {{- end }}
          {{- if has $redisPasswordSource (list "value" "secret") }}
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
          {{- end }}
          ports:
            - name: redis
              containerPort: {{ .Values.redis.service.port }}
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
          {{- if and $redisTls.enabled $redisTlsSecret }}
            - name: redis-tls
              mountPath: {{ $redisTlsMountPath }}
              readOnly: true
          {{- end }}
          {{- with .Values.redis.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with .Values.redis.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: redis-data
          {{- if .Values.redis.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "convertigo.fullname" . }}-redis
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if and $redisTls.enabled $redisTlsSecret }}
        - name: redis-tls
          secret:
            secretName: {{ $redisTlsSecret }}
        {{- end }}
        {{- with .Values.redis.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

{{- if .Values.redis.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "convertigo.fullname" . }}-redis
  labels:
    {{- include "convertigo.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
  storageClassName: {{ .Values.redis.persistence.storageClass | quote }}
{{- end }}
{{- end }}

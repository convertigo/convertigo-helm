{{- if include "convertigo.tlsSelfSigned" . -}}
{{- $name := include "convertigo.tlsSecretName" . -}}
{{- $previous := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $annotations := dict -}}
{{- if $previous -}}{{- $annotations = default dict $previous.metadata.annotations -}}{{- end -}}
{{- $owned := and (eq (index $annotations "meta.helm.sh/release-name" | default "") .Release.Name) (eq (index $annotations "meta.helm.sh/release-namespace" | default "") .Release.Namespace) -}}
{{- /* A Secret of that name outside this release is a certificate provided by the user: left untouched. */ -}}
{{- if or (not $previous) $owned -}}
{{- $previousData := dict -}}
{{- if $previous -}}{{- $previousData = default dict $previous.data -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "convertigo.labels" . | nindent 4 }}
  annotations:
    convertigo.com/self-signed: "true"
type: kubernetes.io/tls
data:
  {{- if and (index $previousData "tls.crt") (index $previousData "tls.key") }}
  {{- /* Kept across upgrades: browsers and clients that accepted it keep trusting it. */}}
  tls.crt: {{ index $previousData "tls.crt" }}
  tls.key: {{ index $previousData "tls.key" }}
  {{- else }}
  {{- $tls := default dict .Values.tls -}}
  {{- $addr := toString (default "localhost" .Values.publicAddr) -}}
  {{- $names := include "convertigo.gatewayHostnames" . | fromJsonArray -}}
  {{- $ips := list -}}
  {{- if regexMatch "^[0-9.]+$|:" $addr -}}
    {{- $ips = list $addr -}}
  {{- else -}}
    {{- $names = prepend $names $addr | uniq -}}
  {{- end -}}
  {{- $cert := genSelfSignedCert (default $addr (first $names)) $ips $names (int (default 3650 $tls.selfSignedDays)) }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
